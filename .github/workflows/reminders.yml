name: Watering reminders

on:
  schedule:
    # Daily at 13:00 UTC (~9am ET). The script itself decides whether to send,
    # based on overdue plants + the cadence set in the dashboard.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # manual test runs

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check overdue plants
        id: check
        env:
          # Optional override: set this secret to keep the address out of the
          # public repo entirely. Otherwise the dashboard setting is used.
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
        run: node scripts/check-reminders.js

      - name: Verify mail credentials
        if: steps.check.outputs.send == 'true'
        env:
          MAIL_USER: ${{ secrets.GMAIL_USERNAME }}
          MAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ]; then
            echo "::error::A reminder is due but the Gmail secrets are missing." \
                 "Add GMAIL_USERNAME (your Gmail address) and GMAIL_APP_PASSWORD" \
                 "(from https://myaccount.google.com/apppasswords) under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Send email
        if: steps.check.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: "MyEasyPlant 🌿 <${{ secrets.GMAIL_USERNAME }}>"
          to: ${{ steps.check.outputs.to }}
          subject: ${{ steps.check.outputs.subject }}
          html_body: file://email.html

      - name: Commit reminder timestamp
        if: steps.check.outputs.send == 'true'
        run: |
          git config user.name "myeasyplant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plants.json
          git commit -m "chore: reminder sent $(date -u +%F)"
          git pull --rebase origin main
          git push
